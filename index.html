<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadro de mando · II PICD Navarra</title>
<style>
:root{
  --red:#c8102e;--red-700:#a10d25;--red-50:#fdf1f3;--red-100:#f8d9df;
  --ink:#1b1f24;--ink-2:#3d4450;--muted:#646b75;--subtle:#8a919b;
  --line:#e3e6ea;--line-2:#d2d7dd;--bg:#f3f4f6;--card:#fff;--field:#fff;
  --blue:#2f5d9a;--blue-50:#edf2f9;--green:#1d7445;--green-50:#e8f5ed;--amber:#8f5b00;--amber-50:#fff4dc;--slate:#3d4450;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 20px 48px rgba(16,24,40,.22);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;line-height:1.45;font-size:14px;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num,.tabular{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{max-width:1560px;margin:0 auto;padding:12px 24px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--card);border-top:4px solid var(--red);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);padding:10px 18px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{width:clamp(200px,22vw,290px);height:auto;display:block}
.brand-sep{width:1px;align-self:stretch;background:var(--line)}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
.title{font-size:clamp(16px,1.4vw,21px);font-weight:700;margin:2px 0 1px;letter-spacing:-.01em}
.subtitle{color:var(--muted);font-size:12.5px}
.actions{display:flex;flex-wrap:nowrap;gap:8px;justify-content:flex-end;flex:0 0 auto}

.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;color:var(--muted);font-size:12px;white-space:nowrap}
.pill strong{color:var(--ink);font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--subtle)}
.pill.ok .dot{background:var(--green)}
.pill.warn{border-color:#f0d398;background:var(--amber-50);color:var(--amber)}
.pill.warn .dot{background:#d99a1c}
.pill.danger{border-color:#f1b8c1;background:var(--red-50);color:var(--red-700)}
.pill.danger .dot{background:var(--red)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.98);border-color:var(--line-2)}
.statusbar .hint{color:var(--subtle);font-size:12px;margin-left:auto}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid #f1b8c1;background:var(--red-50);color:var(--red-700);border-radius:var(--radius-sm);padding:10px 14px;margin-top:12px;font-size:13px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:#fff;color:var(--ink);padding:8px 14px;font-weight:600;font-size:13px;line-height:1.2;min-height:36px;transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:#f7f8f9;border-color:#bfc5cd}
.btn:active{background:#eef0f2}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-700);border-color:var(--red-700)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:#eef0f2}
.btn.danger{color:var(--red-700);border-color:#efc2ca;background:#fff}
.btn.danger:hover{background:var(--red-50)}
.btn.danger-solid{background:var(--red-700);border-color:var(--red-700);color:#fff}
.btn.sm{min-height:30px;padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:#eef0f2;border-color:var(--line)}
.icon-btn.del:hover{background:var(--red-50);color:var(--red-700);border-color:#efc2ca}
.icon-btn svg{width:16px;height:16px}.icon-btn:disabled{opacity:.3;cursor:not-allowed;background:transparent;border-color:transparent;color:var(--ink-2)}
.link{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;margin:18px 0 0;border-bottom:1px solid var(--line-2);scrollbar-width:thin}
.tab{position:relative;border:0;background:transparent;color:var(--muted);padding:11px 16px;font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab .count{min-width:20px;height:20px;border-radius:10px;padding:0 6px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;background:#e9ebee;color:var(--ink-2);font-weight:700}
.tab .count.warn{background:var(--amber-50);color:var(--amber)}
.tab .count.err{background:var(--red);color:#fff}
.tab-panel{padding-top:16px}

/* ---------- Tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.card-head h2{font-size:18px;font-weight:700}
.card-head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:880px}
.card-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.section-label{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:22px 0 10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.section-label.activity{color:var(--red)}
.section-label.result{color:var(--blue)}
.empty{padding:34px 18px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--radius-sm);color:var(--muted);background:#fafbfc}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{margin:0 auto;max-width:560px}
.empty .btn-row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}

/* ---------- Filtros ---------- */
.filters{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.filters-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.filters-title svg{width:16px;height:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--red-50);border:1px solid var(--red-100);color:var(--red-700);border-radius:99px;padding:3px 4px 3px 10px;font-size:12px;font-weight:600;max-width:340px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:transparent;color:inherit;width:20px;height:20px;border-radius:50%;line-height:1;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.chip button:hover{background:var(--red-100)}
.chips .none{color:var(--subtle);font-size:12px;align-self:center}
.filter-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:10px}
.filter{position:relative;min-width:0}
.filter label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.filter-trigger{width:100%;height:32px;border:1px solid var(--line-2);border-radius:7px;background:var(--field);padding:4px 26px 4px 9px;text-align:left;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.filter-trigger::after{content:"";position:absolute;right:10px;top:12px;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg)}
.filter-trigger.active{border-color:var(--red);background:var(--red-50);color:var(--red-700);font-weight:600}
.filter.open .filter-trigger{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.12)}
.filter-pop{position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:max(100%,260px);background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px}
.filter.align-right .filter-pop{left:auto;right:0}
.filter-search{width:100%;height:30px;border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;font-size:12.5px;margin-bottom:6px}
.filter-opts{max-height:240px;overflow:auto}
.filter-opt{display:flex;align-items:flex-start;gap:8px;padding:6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.filter-opt:hover{background:#f4f5f7}
.filter-opt input{accent-color:var(--red);margin:2px 0 0}
.filter-pop-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;padding:14px 16px 12px;min-height:138px}
.kpi.result{border-top-color:var(--blue)}
.kpi.calc{border-top-color:var(--slate)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-code{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--subtle)}
.kpi h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:6px 0 10px;min-height:34px}
.kpi-value{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:5px}
.kpi.empty-kpi .kpi-value{color:var(--line-2)}
.kpi-foot{margin-top:9px;font-size:11.5px;color:var(--subtle)}
.info-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--muted);font-size:11px;font-weight:700;font-family:Georgia,serif;font-style:italic;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;cursor:help}
.info-btn:hover,.info-btn:focus-visible{border-color:var(--ink-2);color:var(--ink)}
.others{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,3fr);gap:12px}
.others-stack{display:grid;gap:12px;align-content:start}
.donut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.donut-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--slate);border-radius:10px;padding:14px 16px 12px}
.donut-card h3{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;min-height:34px}
.donut-body{display:flex;align-items:center;gap:14px;margin-top:6px}
.donut-box{position:relative;width:118px;height:118px;flex:0 0 auto}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center strong{font-size:16px;font-variant-numeric:tabular-nums}
.donut-center span{font-size:10px;color:var(--muted)}
.legend{display:grid;gap:6px;font-size:12px;min-width:0}
.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center}
.legend-row i{width:10px;height:10px;border-radius:3px}
.legend-row b{font-variant-numeric:tabular-nums;font-weight:600}
.donut-foot{margin-top:10px;font-size:11.5px;color:var(--subtle)}

/* ---------- Tablas ---------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.table th{position:sticky;top:0;z-index:2;background:#f5f6f8;color:var(--ink-2);font-size:11px;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px 10px;border-bottom:1px solid #edf0f2;vertical-align:top}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:#fafbfc}
.table .num{text-align:right;white-space:nowrap}
.table .muted{color:var(--subtle)}
.code{font-family:Consolas,"SFMono-Regular",ui-monospace,monospace;font-size:11.5px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.Finalizada{background:var(--green-50);color:var(--green)}
.tag.En-curso{background:var(--amber-50);color:var(--amber)}
.tag.Planificada{background:var(--blue-50);color:var(--blue)}
.tag.Sin-datos{background:#eef0f2;color:var(--muted)}
.dims{display:flex;flex-wrap:wrap;gap:4px}
.dim{background:#eef0f3;border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.dim.total{background:transparent;color:var(--subtle);padding:1px 0}

/* Estructura */
.structure th.ind{text-align:right;min-width:86px}
.structure th.ind abbr{text-decoration:none;display:block;font-size:11px}
.structure th.ind small{display:block;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;font-size:10.5px;white-space:normal;line-height:1.2;margin-top:2px}
.structure td:first-child,.structure th:first-child{position:sticky;left:0;z-index:1;background:inherit}
.structure th:first-child{z-index:3;background:#f5f6f8}
.structure tr.lv-eje td{background:#fbf2f4;font-weight:700}
.structure tr.lv-amb td{background:#fdf9fa;font-weight:600}
.structure tr.lv-act td{background:#fff}
.structure tr.lv-sub td{background:#fff;color:var(--ink-2)}
.structure tr.lv-sub td:first-child{background:#fff}
.tree{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tree-btn{width:22px;height:22px;border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink-2);font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.tree-btn:hover{border-color:var(--red);color:var(--red)}
.tree-pad{display:inline-block;width:22px;flex:0 0 auto}
.lvl-1{padding-left:24px!important}.lvl-2{padding-left:44px!important}.lvl-3{padding-left:64px!important}
.structure .el{min-width:260px;max-width:420px}.structure .resp{white-space:nowrap}

/* ---------- Formulario de captura ---------- */
.guide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.guide div{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.guide b{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:12.5px;margin-bottom:3px}
.step{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.fieldset{border:0;margin:0;padding:18px 0 4px;border-top:1px solid var(--line)}
.fieldset:first-of-type{border-top:0;padding-top:0}
.legend-title{float:left;width:100%;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-bottom:12px;padding:0}.legend-title+*{clear:both}
.legend-title small{font-weight:400;color:var(--muted);font-size:12.5px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.span-2{grid-column:span 2}.span-4{grid-column:1/-1}
.field{min-width:0}
.field>label,.field .label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.req{color:var(--red);margin-left:2px}
.control{width:100%;min-height:38px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--field);padding:7px 10px;font-size:13.5px}
select.control{padding-right:28px}
textarea.control{min-height:64px;resize:vertical}
.control:hover{border-color:#b9c0c8}
.control:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.13)}
.control.placeholder{color:var(--subtle)}
.control[readonly]{background:#f6f7f8;color:var(--ink-2)}
.field.invalid .control{border-color:var(--red);background:#fffafb}
.field-error{display:none;color:var(--red-700);font-size:11.5px;margin-top:4px}
.field.invalid .field-error{display:block}
.field-help{font-size:11.5px;color:var(--subtle);margin-top:4px}
.derived{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.derived .crumb{background:#f2f3f5;border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.derived .crumb b{font-weight:600}
.inline-new{margin-top:8px;padding:12px;border:1px dashed var(--line-2);border-radius:10px;background:#fafbfc}
.ind-info{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;background:#fafbfc;padding:10px 12px;font-size:12.5px;color:var(--ink-2);min-height:38px}
.ind-info.result{border-left-color:var(--blue)}
.ind-info dl{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 0}
.ind-info dt{color:var(--subtle);display:inline}
.ind-info dd{margin:0 0 0 4px;display:inline;font-weight:600;color:var(--ink)}
.ind-info p{margin:0}
.lines-help{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.lines{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.line-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 120px 40px;gap:8px;align-items:start}
.lines-head{background:#f5f6f8;padding:8px 12px;font-size:11px;font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--line)}
.line{padding:10px 12px;border-bottom:1px solid #edf0f2;background:#fff}
.line:last-child{border-bottom:0}
.line .field>label{display:none}
.line .control{min-height:34px;font-size:12.5px;padding:5px 8px}
.line select.control{padding-right:22px}
.line .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.line .icon-btn{margin-top:1px}
.lines-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lines-total{font-size:13px;color:var(--muted)}
.lines-total b{color:var(--ink);font-variant-numeric:tabular-nums}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.form-msg{font-size:13px;color:var(--muted);flex:1;min-width:240px}
.form-msg.error{color:var(--red-700);font-weight:600}
.form-msg.ok{color:var(--green);font-weight:600}
.form-buttons{display:flex;gap:8px;flex-wrap:wrap}
.edit-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-50);border:1px solid #f0d398;color:var(--amber);border-radius:10px;padding:10px 14px;margin:-4px 0 16px;font-size:13px}
.edit-banner strong{color:#6b4400}
.records-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.records-tools .search{flex:1;min-width:220px;position:relative}
.records-tools .search input{padding-left:32px}
.records-tools .search svg{position:absolute;left:10px;top:11px;width:15px;height:15px;color:var(--subtle)}
.records-tools select.control,.records-tools input.control{min-height:36px;font-size:13px}
.records-tools select.control{width:auto;max-width:260px}
.records .cell-main{font-weight:600;color:var(--ink)}
.records .cell-sub{color:var(--muted);font-size:11.5px;margin-top:1px}
.records tr.editing td{background:var(--amber-50)!important}
.records .acts{white-space:nowrap;text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pager-ctrl{display:flex;align-items:center;gap:6px}

/* ---------- Gráficos ---------- */
.select-ind{min-width:340px;max-width:100%}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chart-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;min-width:0}
.chart-card h3{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chart-card h3 span{font-weight:500;font-size:12px;color:var(--muted)}
.chart-box{position:relative;margin-top:8px}
.chart-empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:120px;color:var(--subtle);font-size:12.5px;border:1px dashed var(--line);border-radius:8px;margin-top:8px;padding:12px}
.chart-foot{margin-top:8px;font-size:11.5px;color:var(--subtle)}
.summary-row{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.summary-row .pill{font-size:12.5px}

/* ---------- Calidad ---------- */
.q-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q-badge{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff}
.q-badge.err{border-color:#f1b8c1;background:var(--red-50);color:var(--red-700)}
.q-badge.warn{border-color:#f0d398;background:var(--amber-50);color:var(--amber)}
.q-badge.info{border-color:#cfdcef;background:var(--blue-50);color:var(--blue)}
.q-badge.ok{border-color:#bfe2cc;background:var(--green-50);color:var(--green)}
.sev{display:inline-flex;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.sev.err{background:var(--red);color:#fff}
.sev.warn{background:var(--amber-50);color:var(--amber);border:1px solid #f0d398}
.sev.info{background:var(--blue-50);color:var(--blue)}
.q-list{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.rec-filter{display:flex;align-items:center;gap:8px;background:var(--amber-50);border:1px solid #f0d398;color:var(--amber);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:10px}.rec-filter svg{width:16px;height:16px;flex:0 0 auto}.rec-filter span{flex:1}.dims-missing{margin-top:12px;font-size:12.5px;color:var(--muted)}

/* ---------- Catálogo ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cat-grid .card{margin:0}
.values{display:flex;flex-wrap:wrap;gap:5px}
.values .dim.none-val{background:#fff;border:1px dashed var(--line-2);color:var(--muted)}

/* ---------- Modales, avisos y ayudas ---------- */
.modal-back{position:fixed;inset:0;background:rgba(18,22,28,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal-head{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
.modal-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--blue-50);color:var(--blue)}
.modal-icon.danger{background:var(--red-50);color:var(--red)}
.modal-icon.warn{background:var(--amber-50);color:var(--amber)}
.modal-icon svg{width:18px;height:18px}
.modal-head h2{font-size:17px;margin-top:7px}
.modal-body{padding:12px 20px 4px 68px;overflow:auto;font-size:13.5px;color:var(--ink-2)}
.modal-body p{margin:0 0 10px}
.modal-body ul{margin:0 0 10px;padding-left:18px}
.modal-body li{margin:3px 0}
.modal-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfc;font-size:12.5px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;flex-wrap:wrap}
.toast-zone{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 40px))}
.toast{background:#1f242b;color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;animation:toast-in .2s ease}
.toast.ok{border-left:4px solid #3fbf74}
.toast.err{border-left:4px solid #ff6b81}
.toast.warn{border-left:4px solid #f2b33d}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.tooltip{position:fixed;z-index:130;max-width:320px;background:#1f242b;color:#fff;font-size:12px;line-height:1.45;border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-lg);pointer-events:none}
.drop-overlay{position:fixed;inset:0;z-index:110;background:rgba(200,16,46,.08);border:3px dashed var(--red);display:flex;align-items:center;justify-content:center;pointer-events:none}
.drop-overlay div{background:#fff;border-radius:12px;padding:18px 26px;font-weight:700;box-shadow:var(--shadow-lg);color:var(--red-700)}
footer.foot{margin-top:28px;color:var(--subtle);font-size:11.5px;text-align:center}
#printReport{display:none}
.offscreen{position:fixed;left:-12000px;top:0;width:1200px;visibility:hidden}

/* ---------- Adaptación a pantallas ---------- */
@media (max-width:1280px){
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lines-head{display:none}
  .line .field>label{display:block;font-size:11px}
  .line{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-right:52px}
  .line:nth-child(odd){background:#fafbfc}
  .line .icon-btn{position:absolute;right:12px;top:28px}
  .guide{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1000px){
  .topbar{flex-direction:column;align-items:flex-start}
  .actions{flex-wrap:wrap}
  .actions{justify-content:flex-start}
  .others{grid-template-columns:1fr}
  .others-stack{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-grid,.cat-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statusbar .hint{margin-left:0}
}
@media (max-width:720px){
  .app{padding:8px 12px 32px}
  .brand{flex-direction:column;align-items:flex-start;gap:8px}
  .brand-sep{display:none}
  .brand img{width:220px}
  .actions .btn{flex:1 1 auto}
  .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}
  .card-head{flex-direction:column}
  .card-tools{justify-content:flex-start}
  .select-ind{min-width:0;width:100%}
  .form-grid{grid-template-columns:1fr}
  .span-2{grid-column:auto}
  .line{grid-template-columns:repeat(2,minmax(0,1fr))}
  .guide{grid-template-columns:1fr}
  .others-stack{grid-template-columns:1fr}
  .modal-body{padding-left:20px}
  .records thead{display:none}
  .records,.records tbody,.records tr,.records td{display:block;width:100%}
  .records tr{border-bottom:1px solid var(--line);padding:8px 4px}
  .records td{border:0;padding:3px 8px}
  .records td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--subtle)}
  .records .num,.records .acts{text-align:left}
}


@media (max-width:480px){.kpi-grid{grid-template-columns:1fr}}

</style>
</head>

const tag = s => `<span class="tag ${esc(String(s).replace(/\s/g, '-'))}">${esc(s)}</span>`;

/* ------------------------------ Ayudas ------------------------------ */
function initTooltips(){
  const tip = $('#tooltip'); let current = null;

    current = el; tip.textContent = el.dataset.tip; tip.hidden = false;

/* ------------------------- Barra de estado ------------------------- */

function filterHtml(d, right){

function initFilters(){

    const chip = t.closest('[data-chip-remove]'); if (chip){ const k = chip.dataset.chipRemove; setFilter(k, state.ui.filters[k].filter(v => v !== chip.dataset.value)); return; }

}

function setupCharts(){
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#4b5563';
  Chart.defaults.plugins.tooltip.backgroundColor = '#1f242b';
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.register({
    id: 'valueLabels',
    afterDatasetsDraw(chart, args, opts){
      if (!opts || !opts.display) return;
      const ctx = chart.ctx, horizontal = chart.options.indexAxis === 'y';
      chart.data.datasets.forEach((ds, di) => {
        if ((ds.type || chart.config.type) !== 'bar') return;
        const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
        meta.data.forEach((bar, i) => {
          const v = ds.data[i]; if (v === null || v === undefined) return;
          ctx.save(); ctx.fillStyle = '#1b1f24'; ctx.font = `600 11px ${Chart.defaults.font.family}`;
          if (horizontal){ ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(fmt(v), bar.x + 6, bar.y); }
          else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(fmt(v), bar.x, bar.y - 4); }
          ctx.restore();
        });
      });
    }
  });
}
function hbarHeight(labels){ const lines = Math.max(1, ...labels.map(l => wrapLabel(l, 30).length)); return labels.length * Math.max(30, lines * 14 + 12) + 44; }
function hbarConfig(labels, values, color, unit, still){

/* ------------------------------ Datos derivados ------------------------------ */
function sexSplit(rows, code){
  const e = effRows(rows, code); if (!e.length) return null;
  const tot = sumV(e), w = sumV(e.filter(r => r.Sexo === 'Mujeres')), m = sumV(e.filter(r => r.Sexo === 'Hombres'));
  if (w + m <= 0) return null;
  return {code, tot, w, m, coverage: tot ? (w + m) / tot : 0, seg: [{label: 'Mujeres', value: w, color: COLORS.women}, {label: 'Hombres', value: m, color: COLORS.men}]};
}
function dimBreakdown(rows, code, key){
  const e = effRows(rows, code), d = DIM[key];
  const groups = new Map(); let noneSum = 0;
  e.forEach(r => { const v = r[key]; if (v === d.none) noneSum += r.Valor; else groups.set(v, (groups.get(v) || 0) + r.Valor); });
  let labels = [...groups.keys()];
  if (d.ordinal){ const order = dimValues(key); labels.sort((a, b) => order.indexOf(a) - order.indexOf(b)); }
  else labels.sort((a, b) => groups.get(b) - groups.get(a) || a.localeCompare(b, 'es'));
  return {labels, values: labels.map(l => groups.get(l)), noneSum, total: e.length ? sumV(e) : 0};
}
function evolutionSlots(rows, code){
  const f = state.ui.filters, ind = IND.get(code);
  const slots = PERIOD_SLOTS.filter(s => (!f.Año.length || f.Año.includes(String(s.y))) && (!f.Periodo.length || f.Periodo.includes(s.p)));
  const list = rows.filter(r => r.Cod_Indicador === code);
  let acc = null;
  return slots.map(s => {
    const pr = list.filter(r => timeKey(r) === s.key);
    const val = pr.length ? sumV(pr) : null;
    if (val !== null) acc = (acc || 0) + val;
    let stock = null;
    if (ind.aggregation === 'Último valor'){ const upto = effRows(list.filter(r => timeKey(r) <= s.key), code); stock = upto.length ? sumV(upto) : null; }
    const acts = [...new Set(pr.map(r => r.Cod_Actuación))].sort(sortCode);
    return {...s, rows: pr, val, acc: val === null && acc === null ? null : acc, stock, acts};
  });
}
function firstWithData(rows){ return IND_LIST.find(i => rows.some(r => r.Cod_Indicador === i.code))?.code || IND_LIST[0].code; }
function indicatorSelect(id, selected, rows){

function structureHtml(rows, forPrint){
  const tree = structureTree(), f = state.ui.filters;
  const structFilter = STRUCT_KEYS.some(k => f[k].length);
  const hideEmpty = state.ui.onlyWithData || structFilter || forPrint === 'data';
  let html = '';
  const walk = (node, depth, nrows) => {
    if (hideEmpty && !nrows.length) return;
    const key = `${node.lvl}:${node.code}`, open = forPrint || state.ui.expanded.has(key), hasKids = node.children.length > 0;
    const resp = [...new Set(nrows.map(r => r.Responsable))].sort((a, b) => a.localeCompare(b, 'es'));
    const respTxt = resp.length > 2 ? `${resp.slice(0, 2).join(', ')} +${resp.length - 2}` : resp.join(', ');
    const status = node.lvl === 'sub' ? subStatus(nrows) : nodeStatus(nrows, node);
    const values = IND_LIST.map(i => { const v = total(nrows, i.code); return `<td class="num ${v === null ? 'muted' : ''}">${fmt(v)}</td>`; }).join('');
    const lv = {eje: 'lv-eje', amb: 'lv-amb', act: 'lv-act', sub: 'lv-sub'}[node.lvl];
    if (forPrint){
      html += `<tr class="${lv}"><td class="i${depth}"><span class="code">${esc(node.code)}</span></td><td class="i${depth}">${esc(node.name)}</td><td>${tag(status)}</td>${values}</tr>`;
    } else {
      const btn = hasKids ? `<button type="button" class="tree-btn" data-toggle="${esc(key)}" aria-expanded="${open}" aria-label="${open ? 'Plegar' : 'Desplegar'} ${esc(node.code)}">${open ? '−' : '+'}</button>` : '<span class="tree-pad"></span>';
      html += `<tr class="${lv}"><td class="lvl-${depth}"><span class="tree">${btn}<span class="code">${esc(node.code)}</span></span></td><td class="el">${esc(node.name)}</td><td>${tag(status)}</td><td class="resp" ${resp.length > 2 ? `data-tip="${esc(resp.join(', '))}"` : ''}>${esc(respTxt) || '<span class="muted">—</span>'}</td>${values}</tr>`;
    }
    if (hasKids && open) node.children.forEach(c => walk(c, depth + 1, nodeRows(nrows, c)));
  };
  tree.forEach(n => walk(n, 0, nodeRows(rows, n)));
  const heads = IND_LIST.map(i => `<th class="ind"><abbr data-tip="${esc(`${i.name} (${i.unit}). ${ruleText(i)}.`)}">${i.code}</abbr><small>${esc(i.short)}</small></th>`).join('');

  return `<div class="card-head"><div><h2>Estructura del plan</h2><p>Ejes, ámbitos, actuaciones y subactuaciones del catálogo con su estado y los valores de cada indicador (misma regla de cálculo que las tarjetas). ${structFilter ? 'Se muestran solo los elementos con datos para los filtros de estructura aplicados.' : ''}</p></div><div class="card-tools"><label class="pill" style="cursor:pointer"><input type="checkbox" id="onlyWithData" ${state.ui.onlyWithData ? 'checked' : ''} ${structFilter ? 'disabled' : ''} style="accent-color:var(--red);margin:0"> Solo con datos</label><button type="button" class="btn sm" data-expand="all">Desplegar todo</button><button type="button" class="btn sm" data-expand="none">Plegar todo</button></div></div>
  <div class="table-wrap" style="max-height:640px"><table class="table structure"><thead><tr><th>Código</th><th>Elemento</th><th>Estado</th><th>Responsables</th>${heads}</tr></thead><tbody>${html || `<tr><td colspan="${4 + IND_LIST.length}" class="muted">No hay elementos con datos para la selección.</td></tr>`}</tbody></table></div>`;
}

  const cards = all.filter(x => x.b.labels.length), missing = all.filter(x => !x.b.labels.length).map(x => x.d.label.toLowerCase());
  p.innerHTML = `<div class="card"><div class="card-head"><div><h2>Visión detallada</h2><p>Reparto del indicador por cada dimensión de desglose. Solo se representan los registros desglosados; la parte sin desglose se indica bajo cada gráfico.</p></div><div class="card-tools">${indicatorSelect('detailInd', code, rows)}</div></div>
    <div class="summary-row"><span class="pill">Total <strong>${fmt(tot)}</strong> ${tot === null ? '' : esc(ind.unit)}</span><span class="pill">${esc(ruleText(ind))}</span><span class="pill">${filterNote()}</span></div>
    ${tot === null ? `<div class="empty"><h3>Sin datos</h3><p>No hay registros de «${esc(ind.name)}» con los filtros actuales.</p></div>` : `${cards.length ? `<div class="chart-grid">${cards.map(({d, b}) => {
      const h = hbarHeight(b.labels);
      return `<div class="chart-card"><h3>${esc(d.label)}<span>${plural(b.labels.length, 'categoría')}</span></h3><div class="chart-box" style="height:${h}px"><canvas id="det-${esc(d.key)}" aria-label="${esc(d.label)}"></canvas></div><div class="chart-foot">${b.noneSum > 0 ? `Sin desglose por ${esc(d.label.toLowerCase())}: ${fmt(b.noneSum)} ${esc(ind.unit)} (${fmtPct(b.noneSum / b.total)} del total).` : 'Todo el valor está desglosado en esta dimensión.'}</div></div>`;
    }).join('')}</div>` : `<div class="empty"><p>Ningún registro de «${esc(ind.name)}» está desglosado con los filtros actuales.</p></div>`}${cards.length && missing.length ? `<p class="dims-missing">Sin registros desglosados por: ${esc(missing.join(', '))}.</p>` : ''}`}</div>`;
  cards.forEach(({d, b}) => { state.charts[`det-${d.key}`] = new Chart($(`#det-${CSS.escape(d.key)}`), hbarConfig(b.labels, b.values, color, ind.unit)); });
  $('#detailInd').addEventListener('change', ev => { state.ui.detailCode = ev.target.value; renderActive(); $('#detailInd')?.focus(); });
}

/* -------------------------------- Evolución -------------------------------- */
function renderEvolution(){
  const p = $('#panel-evolucion');
  if (!state.records.length){ p.innerHTML = noDataPanel('Evolución'); return; }
  const rows = filteredRows();
  const code = state.ui.evoCode && IND.has(state.ui.evoCode) ? state.ui.evoCode : firstWithData(rows);
  state.ui.evoCode = code;
  const ind = IND.get(code), stock = ind.aggregation === 'Último valor', slots = evolutionSlots(rows, code);
  const any = slots.some(s => s.rows.length);
  const help = stock ? 'Indicador acumulado: cada punto muestra el total existente al cierre del periodo (último dato disponible de cada subactuación y desglose hasta ese momento).' : 'Las barras muestran el valor registrado en cada periodo y la línea, el acumulado desde el primer periodo mostrado.';
  p.innerHTML = `<div class="card"><div class="card-head"><div><h2>Evolución temporal</h2><p>${help}</p></div><div class="card-tools">${indicatorSelect('evoInd', code, rows)}</div></div>
    ${any ? `<div class="chart-card"><div class="chart-box" style="height:300px"><canvas id="evoChart" aria-label="Evolución de ${esc(ind.name)}"></canvas></div></div>` : `<div class="empty"><h3>Sin datos</h3><p>No hay registros de «${esc(ind.name)}» con los filtros actuales.</p></div>`}
    <div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Año</th><th>Periodo</th>${stock ? '<th class="num">Total al cierre</th><th class="num">Valor comunicado</th>' : '<th class="num">Valor del periodo</th><th class="num">Acumulado</th>'}<th class="num">Registros</th><th>Actuaciones con datos</th></tr></thead><tbody>${slots.map(s => `<tr><td>${s.y}</td><td>${s.p}</td>${stock ? `<td class="num">${fmt(s.stock)}</td><td class="num ${s.val === null ? 'muted' : ''}">${fmt(s.val)}</td>` : `<td class="num ${s.val === null ? 'muted' : ''}">${fmt(s.val)}</td><td class="num">${fmt(s.acc)}</td>`}<td class="num">${s.rows.length || '<span class="muted">—</span>'}</td><td>${s.acts.length ? s.acts.map(a => `<span class="code">${a}</span> ${esc(ACTIONS.get(a)?.Actuación || '')}`).join('<br>') : '<span class="muted">Sin registros</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
  if (any) state.charts.evo = new Chart($('#evoChart'), evoConfig(ind, slots));
  $('#evoInd').addEventListener('change', ev => { state.ui.evoCode = ev.target.value; renderActive(); $('#evoInd')?.focus(); });
}

/* --------------------------- Datos publicados --------------------------- */
/* La versión pública muestra la copia JSON exportada desde el cuadro interno y publicada
   junto a este HTML (datos.json). Se valida con las mismas reglas que al cargar una copia. */
const DATA_URL = 'datos.json';
async function loadPublished(){
  let payload;
  try {
    const resp = await fetch(DATA_URL, {cache: 'no-cache'});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    payload = await resp.json();
  } catch (e) {
    console.error(e);
    return location.protocol === 'file:'
      ? 'No se han podido cargar los datos: este cuadro debe abrirse desde un servidor web, con el archivo datos.json en la misma carpeta.'
      : 'No se han podido cargar los datos del cuadro. Inténtalo de nuevo más tarde.';
  }
  const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.data) ? payload.data : Array.isArray(payload?.records) ? payload.records : null;
  if (!rows) return 'El archivo de datos no tiene el formato esperado.';
  const res = processRows(rows, payload.extensions || payload.ext || null);
  state.records = res.records; state.ext = res.ext;
  state.meta.dataDate = payload.exportedAt ? new Date(payload.exportedAt) : null;
  if (res.invalid.length) console.warn(`${res.invalid.length} registros no superan la validación y no se muestran.`, res.invalid);
  subCache = null;
  return state.records.length ? '' : 'Todavía no hay datos publicados.';
}

/* ------------------------------ Arranque ------------------------------ */
function initTabs(){
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) activate(t.dataset.tab); });
  $('#tabs').addEventListener('keydown', e => {
    const tabs = $$('.tab'), i = tabs.findIndex(t => t.dataset.tab === state.ui.tab);
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = tabs.length - 1;
    if (n !== null){ e.preventDefault(); activate(tabs[n].dataset.tab, true); }
  });
}
async function init(){
  setupCharts();
  initTooltips(); initTabs(); initFilters(); initGeneral();
  state.meta.loadError = 'Cargando datos…';
  renderChrome(); activate('general');
  state.meta.loadError = await loadPublished();
  renderChrome(); activate('general');
}
/* API mínima para diagnóstico desde la consola del navegador. */
window.PICD = {version: VERSION, state, total, effRows};
init();
})();
